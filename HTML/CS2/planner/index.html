<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Planner</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">CS2 // <span>Planner</span></div>
  <div class="tools">
    <button class="btn" id="btnNew">Nuovo</button>
    <button class="btn" id="btnOpen">Apri…</button>
    <button class="btn primary" id="btnSave">Salva file</button>
    <input type="file" id="fileOpen" accept=".cs2plan,.json,.gz" hidden>
    <span class="sep"></span>
    <button class="btn" id="btnDemo" title="Genera un terreno finto per provare la pagina (verrà sostituito dall'import)">Terreno di prova</button>
  </div>
  <a class="back" href="../cs2-reference.html">← Reference sheet</a>
</header>

<main class="layout">
  <aside class="side">
    <section class="box">
      <h4>Progetto</h4>
      <label class="field">Nome <input id="pName" type="text"></label>
      <label class="field">Lato mappa (m) <input id="pSize" type="number" min="1000" step="1"></label>
      <label class="field">Livello del mare (m) <input id="pSea" type="number" step="1"></label>
      <label class="field">Vento <b id="vWind"></b><input id="pWind" type="range" min="0" max="355" step="5"></label>
    </section>
    <section class="box" id="panel"></section>
  </aside>
  <section class="mapwrap">
    <canvas id="map"></canvas>
    <div class="maptools">
      <button class="btn" id="zIn">+</button>
      <button class="btn" id="zOut">−</button>
      <button class="btn" id="zFit">⤢</button>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="cursor">—</span>
  <span id="status"></span>
</footer>

<script src="js/core/util.js"></script>
<script src="js/core/geom.js"></script>
<script src="js/core/roads.js"></script>
<script src="js/core/raster.js"></script>
<script src="js/core/project.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/ui/view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
